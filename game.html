<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>MakeAcoffee ☕</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:radial-gradient(circle at top,#2b1b14,#120b08);
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  padding:20px;
  box-sizing:border-box;
}

.game{
  width:100%;
  max-width:520px;
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:16px;
  padding:20px;
  backdrop-filter:blur(10px);
}

h1{
  text-align:center;
  margin-bottom:10px;
}

.stats{
  display:flex;
  justify-content:space-between;
  margin-bottom:15px;
  font-size:14px;
}

.layout{
  display:flex;
  gap:15px;
}

.main{
  flex:2;
}

.recipes{
  flex:1;
  background:rgba(255,255,255,0.04);
  border-radius:12px;
  padding:10px;
  font-size:12px;
}

.recipe{
  background:rgba(255,255,255,0.05);
  padding:8px;
  border-radius:8px;
  margin-bottom:10px;
}

.customer{
  background:rgba(255,255,255,0.06);
  padding:12px;
  border-radius:12px;
  margin-bottom:10px;
  border-left:4px solid #c96a2b;
}

.customer.angry{
  border-left-color:red;
}

.customer.vip{
  border-left-color:gold;
}

.ingredients{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:10px;
}

button{
  flex:1;
  min-width:48%;
  padding:10px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  background:#c96a2b;
  color:white;
  font-size:12px;
  transition:.2s;
}

button:hover{
  background:#a8551f;
}

.serve{
  width:100%;
  margin-top:10px;
  background:#8b5e3c;
}

.log{
  text-align:center;
  margin-top:10px;
  min-height:20px;
  font-size:13px;
}

@media(max-width:700px){
  .layout{
    flex-direction:column;
  }
}
</style>
</head>

<body>

<div class="game">

<h1>MakeAcoffee ☕</h1>

<div class="stats">
  <div>Score: <span id="score">0</span></div>
  <div>Time: <span id="time">0</span></div>
</div>

<div class="layout">

  <div class="main">

    <div id="customerArea"></div>

    <div class="ingredients" id="ingredients"></div>

    <button class="serve" onclick="serve()">
      Serve Drink
    </button>

    <div class="log" id="log">
      Build the coffee ☕
    </div>

  </div>

  <div class="recipes">
    <h3>📖 Recipe Book</h3>

    <div class="recipe">
      ☕ Latte<br>
      Espresso + Milk
    </div>

    <div class="recipe">
      ☕ Cappuccino<br>
      Espresso + Milk + Foam
    </div>

    <div class="recipe">
      ☕ Caramel Macchiato<br>
      Espresso + Milk + Foam + Caramel
    </div>

  </div>

</div>

</div>

<script>

/* =========================
   DATA
========================= */

const ingredientList = [
  "Espresso",
  "Milk",
  "Foam",
  "Caramel"
];

const recipes = {
  "Latte": ["Espresso","Milk"],
  "Cappuccino": ["Espresso","Milk","Foam"],
  "Caramel Macchiato": ["Espresso","Milk","Foam","Caramel"]
};

const names = [
  "Alex",
  "Mia",
  "Liam",
  "Sofia",
  "Noah",
  "Emma"
];

/* =========================
   GAME STATE
========================= */

let customer = null;
let build = [];
let score = 0;
let time = 0;
let currentEvent = null;

/* =========================
   RANDOM EVENTS
========================= */

function randomEvent(){

  const roll = Math.random();

  if(roll < 0.25){
    currentEvent = "rush";
    log("🔥 Rush Hour!");
  }

  else if(roll < 0.45){
    currentEvent = "vip";
    log("👑 VIP Customer Incoming!");
  }

  else{
    currentEvent = null;
  }
}

/* =========================
   CUSTOMER
========================= */

function spawn(){

  const keys = Object.keys(recipes);

  let customerTime = 18;
  let mood = "";

  if(currentEvent === "rush"){
    customerTime = 10;
    mood = "angry";
  }

  customer = {
    name: names[Math.floor(Math.random()*names.length)],
    order: keys[Math.floor(Math.random()*keys.length)],
    time: customerTime,
    mood: mood,
    vip: currentEvent === "vip"
  };

  build = [];

  updateUI();
}

/* =========================
   INGREDIENTS
========================= */

function shuffleIngredients(){

  const container =
    document.getElementById("ingredients");

  const shuffled = [...ingredientList]
    .sort(() => Math.random() - 0.5);

  container.innerHTML = "";

  shuffled.forEach(item => {

    const btn = document.createElement("button");

    btn.textContent = item;

    btn.onclick = () => add(item);

    container.appendChild(btn);

  });

}

function add(item){

  build.push(item);

  log("Added: " + item);

}

/* =========================
   SERVE
========================= */

function serve(){

  if(!customer) return;

  const required = recipes[customer.order];

  const correct =
    required.length === build.length &&
    required.every(item => build.includes(item));

  if(correct){

    let gain = 10;

    if(customer.vip){
      gain += 10;
    }

    score += gain;

    log("✅ Perfect Drink! +" + gain);

  } else {

    score -= 5;

    log("❌ Wrong Recipe!");

  }

  customer = null;

  build = [];

  shuffleIngredients();

  setTimeout(() => {

    randomEvent();

    spawn();

  }, 800);

  updateUI();

}

/* =========================
   UI
========================= */

function updateUI(){

  const area =
    document.getElementById("customerArea");

  if(customer){

    let classes = "customer";

    if(customer.mood === "angry"){
      classes += " angry";
    }

    if(customer.vip){
      classes += " vip";
    }

    area.innerHTML = `
      <div class="${classes}">
        <strong>${customer.name}</strong>
        ${customer.vip ? "👑 VIP" : ""}
        <br><br>

        Wants:
        <strong>${customer.order}</strong> ☕

        <br><br>

        ⏱ ${customer.time}s left
      </div>
    `;

  } else {

    area.innerHTML = `
      <div class="customer">
        Waiting for customer...
      </div>
    `;

  }

  document.getElementById("score").textContent =
    score;

  document.getElementById("time").textContent =
    time;

}

function log(msg){

  document.getElementById("log").textContent =
    msg;

}

/* =========================
   TIMER
========================= */

function tick(){

  time++;

  if(customer){

    customer.time--;

    if(customer.time <= 0){

      log("⛔ Customer Left!");

      customer = null;

      build = [];

      setTimeout(() => {

        randomEvent();

        spawn();

      }, 800);

    }

  }

  updateUI();

}

/* =========================
   START GAME
========================= */

function startGame(){

  shuffleIngredients();

  randomEvent();

  spawn();

  setInterval(tick, 1000);

}

document.addEventListener(
  "DOMContentLoaded",
  startGame
);

</script>

</body>
</html>
